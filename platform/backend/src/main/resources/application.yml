server:
  port: ${PORT:8080}
  address: ${BIND_ADDRESS:127.0.0.1}
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/nexo}
    username: ${DATABASE_USER:nexo}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      url: ${REDIS_URL:redis://127.0.0.1:6379}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
nexo:
  jwt-secret: ${JWT_SECRET}
  cookie-secure: ${COOKIE_SECURE:true}
  public-origin: ${PUBLIC_ORIGIN:http://localhost:5173}
  mail-from: ${SMTP_FROM:}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  allow-private-sources: ${ALLOW_PRIVATE_SOURCES:false}

